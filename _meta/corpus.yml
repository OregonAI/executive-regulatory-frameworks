# Corpus configuration — the single source of truth corpus-toolkit reads.
corpus:
  id: "executive-regulatory-frameworks"
  name: "Oregon Executive Regulatory Frameworks"
  jurisdiction: "oregon"
  archetype: "document"
  schema_version: 1
  contract_version: 1

content_roots:
  # jurisdiction-wide: one doc_type for the whole directory
  - path: "statutes"
    doc_type: statute
  - path: "rules"
    doc_type: rule
  - path: "executive-orders"
    doc_type: executive_order
  - path: "external-references"
    doc_type: external_reference
  # The Oregon Constitution (ADR 0005), one document per section. It sits at the top of the
  # authority chain every other root here hangs from, and it is jurisdiction-wide by
  # definition: no issuing body owns it.
  - path: "constitution"
    doc_type: constitutional_provision
  # issuing-body-scoped: agencies/<slug>/<subdir>
  - path: "agencies"
    scoped: true
    subdirs:
      policies: policy
      procedures: procedure
      accounting-manual: manual
      standards: standard
      # Special records-retention schedules, folded in from the retired
      # OregonAI/oregon-records-retention corpus (PLAN.md Phase 9). Scoped under the agency
      # the schedule BINDS, not the one that issued it: `issuing_body` stays "Secretary of
      # State, Archives Division" on all 76, and agency_profile keys its views on the
      # frontmatter `agency:` field, so this is where someone asking "how long must DEQ keep
      # this?" actually looks.
      schedules: schedule

# DOC TYPES THIS CORPUS ADDS to the shared schema's enum (corpus-toolkit#40).
#
# `verbatim: true` is the load-bearing half and it is a claim about reproduction, not about
# formatting: the Oregon Constitution is state-authored law this repo is entitled to mirror,
# so corpus-verify-provenance must hold its documents to the same line-by-line containment
# and coverage checks as a statute or a rule. Declared false, a constitutional section
# summarized instead of mirrored would pass every gate in the platform.
schema:
  doc_types:
    - name: constitutional_provision
      verbatim: true

plugins:
  citation_module: "src.citation_schemes"
  snapshot_slice_module: "src.snapshot_slice:slice"
  # THE SHARED IMPLEMENTATION, not this repo's copy. Identical behaviour -- verified
  # against this corpus's own artifact, the two return the same rankings for the same
  # queries -- but the shared one carries RemoteEmbedder, which is what lets the query
  # encoder live in one process instead of one per corpus. Seven copies of bge-m3 is
  # ~14.8 GiB against a 14.1 GiB host; that is why six sibling corpora had no semantic
  # search at all until now.
  semantic_search_module: "corpus_toolkit.semantic.search"
  issuing_body_registry: "_meta/catalog/agencies.yml"
  issuing_body_registry_key: "organizations"
  issuing_body_profiles: "_meta/agency-profiles.yml"

  # WHICH FRONTMATTER KEY CARRIES THE REGISTRY SLUG (corpus-toolkit>=1.23.0).
  #
  # Without this, attribution is PATH-DERIVED ONLY: a slug is inferred from
  # `agencies/<slug>/...`, and a rule filed under its OAR chapter reaches no agency folder.
  # Measured on this corpus: 960 of 75,905 documents attributed, 1.3%. Counts built on that
  # alone under-report by 97% for the largest agencies (corpus-toolkit#71) -- and looked
  # exactly like counts built on a complete corpus.
  #
  # `agency:` is present on 75,905 of 75,905 documents and is already the corpus's own
  # identity key: validate_frontmatter.py requires it to be 'statewide', 'external', or a
  # slug from _meta/catalog/agencies.yml, so it is CHECKED rather than merely populated.
  issuing_body_slug_field: "agency"

  # THE TWO VALUES THAT MEAN "NO SINGLE AGENCY", declared so they read as RESOLVED rather
  # than as gaps (corpus-toolkit#94).
  #
  # They are not invented here -- they are the vocabulary validate_frontmatter.py has always
  # enforced, and 37,992 documents carry one. Undeclared, every one of them lands in
  # `no_registry_entry`, which the toolkit reports as "names a body the registry does not
  # contain" -- indistinguishable from a typo -- and holds this corpus's attribution
  # coverage at a FLOOR permanently, on 50% of its documents.
  #
  #   statewide (37,991)  a rule, statute or policy that binds every agency and is owned by
  #                       none: ORS, OAR and DAS statewide policy
  #   external  (1)       issued outside this registry's scope entirely -- NIST SP 800-53,
  #                       referenced by Oregon policy but not an Oregon body
  #
  # A sentinel WINS OUTRIGHT over the path-derived slug and does not fall through: a
  # `statewide` document filed under agencies/<slug>/ is attributed to no body, which is the
  # corpus contradicting a directory on purpose. Neither value may name a registry entry;
  # the toolkit refuses that collision at load.
  issuing_body_slug_sentinels:
    - statewide
    - external
  extra_schema_checks:
    - path: "_meta/agency-profiles.yml"
      schema: "_meta/schema/agency-profile.schema.json"
    - path: "_meta/sources/*.yml"
      schema: "_meta/schema/source-group.schema.json"

# THE FIRST SIBLING THIS CORPUS DECLARES. Everything else on the platform points AT this
# corpus; this is the one direction that runs outward, and it exists because the authority
# chain stopped at the state border. 14 Oregon rules and one DAS manual name 2 CFR 200 in
# `legal_authority` or `statutes_implemented`, and until now that stated legal basis resolved
# to nothing.
#
# MEASURED, and small: 1 of 1,250 external targets, 15 of 916 authority claims (1.6%). The
# remaining 901 are CFR titles and U.S. Code sections federal-reference does not hold; they
# begin resolving as its intake grows, with no change here.
siblings:
  - id: "federal-reference"
    index_url: "https://oregonai.github.io/federal-reference/corpus-index.json"
    web_base:  "https://github.com/OregonAI/federal-reference/blob/main/"

disclaimer_marker: "NON-AUTHORITATIVE"
graph_path: "_meta/graph.json"
source_manifest_path: "_meta/sources"
snapshot_dir: "_meta/snapshots"

mcp:
  # `authority_chain` walks implements/implemented_by only. This corpus has 1,226 `related`
  # edges that it therefore cannot reach — 796 of its own plus the 430 the folded-in
  # retention schedules bring — so the tool answered nothing for a question those edges
  # exist to answer. That was OregonAI/oregon-records-retention#9, and it is closed here.
  #
  # Returned under `up_cites`, NOT relabelled `implements`. A special schedule SUPPLEMENTS
  # the OAR 166 general rules; it does not implement them, and an earlier pass of this
  # migration did derive 851 `implements` edges before that was caught and reverted. The
  # tool walks what the graph claims; it does not upgrade the claim.
  authority_relations:
    up:
      cites: [related]
  server_name: "executive-regulatory-frameworks"
  # Surfaced on every get_document response (allow-listed; missing keys are skipped).
  # `upstream_tracking` is the OAR honesty field (#78): `manifest` = the rule has a
  # per-source entry in _meta/sources/oar.yml and scheduled drift detection re-hashes
  # it; `none` = mass-imported, NOTHING re-checks it against upstream — an agent citing
  # such a rule should treat `retrieved` as the last known-good date, not as freshness.
  # Maintained by src/mark_upstream_tracking.py (CI-gated with --check).
  extra_document_fields:
    - upstream_tracking
  # NOTE: there is no `transports:` key here. corpus-toolkit parses one into
  # CorpusConfig.mcp_transports and then reads it nowhere — the transport is chosen
  # solely by the --http flag on corpus-mcp-serve. Declaring it implied a control
  # that does not exist.

status:
  reverify_days: 90

provenance:
  coverage_fail_threshold: 0.70
  coverage_warn_threshold: 0.90
