# Corpus configuration — the single source of truth corpus-toolkit reads.
corpus:
  id: "executive-regulatory-frameworks"
  name: "Oregon Executive Regulatory Frameworks"
  jurisdiction: "oregon"
  archetype: "document"
  schema_version: 1
  contract_version: 1

content_roots:
  # jurisdiction-wide: one doc_type for the whole directory
  - path: "statutes"
    doc_type: statute
  - path: "rules"
    doc_type: rule
  - path: "executive-orders"
    doc_type: executive_order
  - path: "external-references"
    doc_type: external_reference
  # issuing-body-scoped: agencies/<slug>/<subdir>
  - path: "agencies"
    scoped: true
    subdirs:
      policies: policy
      procedures: procedure
      accounting-manual: manual
      standards: standard
      # Special records-retention schedules, folded in from the retired
      # OregonAI/oregon-records-retention corpus (PLAN.md Phase 9). Scoped under the agency
      # the schedule BINDS, not the one that issued it: `issuing_body` stays "Secretary of
      # State, Archives Division" on all 76, and agency_profile keys its views on the
      # frontmatter `agency:` field, so this is where someone asking "how long must DEQ keep
      # this?" actually looks.
      schedules: schedule

plugins:
  citation_module: "src.citation_schemes"
  snapshot_slice_module: "src.snapshot_slice:slice"
  semantic_search_module: "src.semantic_search"
  issuing_body_registry: "_meta/catalog/agencies.yml"
  issuing_body_registry_key: "organizations"
  issuing_body_profiles: "_meta/agency-profiles.yml"
  extra_schema_checks:
    - path: "_meta/agency-profiles.yml"
      schema: "_meta/schema/agency-profile.schema.json"
    - path: "_meta/sources/*.yml"
      schema: "_meta/schema/source-group.schema.json"

# THE FIRST SIBLING THIS CORPUS DECLARES. Everything else on the platform points AT this
# corpus; this is the one direction that runs outward, and it exists because the authority
# chain stopped at the state border. 14 Oregon rules and one DAS manual name 2 CFR 200 in
# `legal_authority` or `statutes_implemented`, and until now that stated legal basis resolved
# to nothing.
#
# MEASURED, and small: 1 of 1,250 external targets, 15 of 916 authority claims (1.6%). The
# remaining 901 are CFR titles and U.S. Code sections federal-reference does not hold; they
# begin resolving as its intake grows, with no change here.
siblings:
  - id: "federal-reference"
    index_url: "https://oregonai.github.io/federal-reference/corpus-index.json"
    web_base:  "https://github.com/OregonAI/federal-reference/blob/main/"

disclaimer_marker: "NON-AUTHORITATIVE"
graph_path: "_meta/graph.json"
source_manifest_path: "_meta/sources"
snapshot_dir: "_meta/snapshots"

mcp:
  # `authority_chain` walks implements/implemented_by only. This corpus has 1,226 `related`
  # edges that it therefore cannot reach — 796 of its own plus the 430 the folded-in
  # retention schedules bring — so the tool answered nothing for a question those edges
  # exist to answer. That was OregonAI/oregon-records-retention#9, and it is closed here.
  #
  # Returned under `up_cites`, NOT relabelled `implements`. A special schedule SUPPLEMENTS
  # the OAR 166 general rules; it does not implement them, and an earlier pass of this
  # migration did derive 851 `implements` edges before that was caught and reverted. The
  # tool walks what the graph claims; it does not upgrade the claim.
  authority_relations:
    up:
      cites: [related]
  server_name: "executive-regulatory-frameworks"
  # NOTE: there is no `transports:` key here. corpus-toolkit parses one into
  # CorpusConfig.mcp_transports and then reads it nowhere — the transport is chosen
  # solely by the --http flag on corpus-mcp-serve. Declaring it implied a control
  # that does not exist.

status:
  reverify_days: 90

provenance:
  coverage_fail_threshold: 0.70
  coverage_warn_threshold: 0.90
