group: department-of-human-services-transmittals
title: 'Department of Human Services Policy Transmittals (issue #79 pilot)'
kind: content-hash
recheck: monthly
last_checked: '2026-10-01'
upstream_signal: 'SharePoint DOCUMENT LIBRARY at /odhs/transmittals/APDTransmittals, queried via RenderListDataAsStream
  (same technique as department-of-human-services-policies.yml), filtered to Transmittal_x0020_type ==
  ''Policy'' (Policy Transmittals only -- Action Requests and Information Memoranda are explicitly out
  of scope per issue #79''s grilling comment). This is the ODHS Aging and People with Disabilities (APD)
  program''s own Policy Transmittal system, NOT the agency-wide ''policiesguidelines'' list the 17 held
  DHS policies come from -- the two numbering schemes do not overlap (see CHANGELOG and .out-of-scope/
  for the pilot''s measured result). Pilot-capped at the 25 most recent APD Policy transmittals by Date;
  not a live-tracked feed -- re-running --discover against the same list and re-hashing members is how
  a future, non-piloted expansion would detect drift.'
