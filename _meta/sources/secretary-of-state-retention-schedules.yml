group: secretary-of-state-retention-schedules
title: Secretary of State Archives Division special records-retention schedules
kind: content-hash
recheck: quarterly
last_checked: '2026-08-01'
upstream_signal: 'SharePoint index at https://sos.oregon.gov/archives/records-management/Pages/state-admin-schedules.aspx.
  TWO TRAPS, both learned the hard way in the retired oregon-records-retention repo: (1) the page''s raw
  HTML hash is UNSTABLE — it carries a fresh __VIEWSTATE and correlation id on every request, so change
  detection must diff the extracted LINK SET, never the page bytes; (2) titles come from the paragraph
  label PRECEDING each anchor, because 66 of the 76 anchors read literally ''Schedule''. src/enumerate_schedules.py
  encodes both.'
