upstream_signal: Amendments referred to the voters and decided at the general election, November of even-numbered
  years (ADR 0005). The Legislature publishes the whole document as ONE HTML page, so this group has one source
  and one sha256 for all 18 articles - any amendment anywhere moves it, and the signal says that something changed
  and never what. The diff does that work.
