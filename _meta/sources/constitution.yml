  notes: 'Oregon Constitution, all 18 articles on one page, in effect following the approval of amendments and revisions
    on November 5, 2024. THE PHASE THIS CLOCK STARTS ON IS A DECISION (ADR 0005): 2026-08-21 is the day the page
    was actually fetched and hashed, not the month after an election, which is where this cadence lands well. Written
    honestly rather than back-dated to a check nobody made - the consequence is that 765 days puts the first due
    date at 2028-09-24, which is AFTER the November 2026 election it should follow by 22 months. It self-corrects
    on the first check made after that election, because check_updates.py re-anchors last_checked on the day the
    check ran: a check on 2026-12-10 comes due again 67 days after the November 2028 election. The quarterly full
    sweep in scheduled.yml re-hashes this URL regardless of the cadence, so drift is still seen; a cadence that
    could state its own phase is #198. The raw page bytes are NOT stable - it is served with a fresh ASP.NET view
    state per request - so this sha256 is the hash of the extracted text (repo_lib.content_hash), which is stable
    across fetches.'
