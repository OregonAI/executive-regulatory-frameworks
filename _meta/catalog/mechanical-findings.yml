note: 'Conflict candidates decidable BY CODE — no model involved. A hand-labelled taxonomy of the 137
  frontier-pilot candidates found 29% of them were of these four deterministic types, and a regex finds
  far more of them than the models did: the pilot reported 21 dead citations in total, this scan finds
  1,968 DISTINCT dead targets, cited 5,515 times across 4,528 documents. READ THE DISTINCT COUNT, NOT
  THE OCCURRENCES: they differ by ~2.7x because a single repealed section is cited by many rules — ORS
  184.616 alone is cited by 727 of them. Occurrences are the blast radius; distinct targets are the number
  of things to actually resolve, and they are heavily concentrated, so the top handful clear thousands
  of documents. The magnitude is expected: Oregon has renumbered wholesale (ORS 181 to 181A in 2015, ORS
  279 split into 279A/B/C in 2003, the 2015 higher-education restructuring), and every rule written before
  those still cites the old numbers. A decades-spanning corpus of 36,953 rules showing NO stale citations
  would be the surprising result. Verified against the live source: six sampled flagged sections were
  all genuinely absent, and a live control section was correctly not flagged. Everything here is a CANDIDATE,
  not a finding, and not legally reviewed. The model''s budget belongs on the other 71% — what a rule
  omits, adds without authority, or redefines — which SYSTEM_V3 enumerates and which explicitly disqualifies
  these four types so the two passes do not overlap.'
