note: 'Canonical registry of Oregon agencies and their sub-units, keyed on the OAR chapter assignment
  scheme as presented by oregon.public.law/rules (an unofficial but well-maintained mirror; official chapter
  assignment lives with the SoS Administrative Rules Unit). The names the scrape produces come from each
  chapter page''s own title; the index tree provides the parent/sub-unit hierarchy, recorded in `relations`
  (ADR 0004) with parent_chapter beside it. Third registry source: a data.oregon.gov dataset and the SoS
  Blue Book directory were both previously used and dropped after review (2026-07-18/19). validate_frontmatter.py
  requires every content file''s agency: field to resolve to ''statewide'', ''external'', or a slug here.
  THREE NAME FIELDS, WHICH ARE THREE DIFFERENT STRINGS. name is the STATUTORY name (ADR 0003) — the name
  the body''s enabling authority gives it — and name_basis, on every row, says whether this row actually
  holds one: enabling-authority means a human read the body''s enabling authority and recorded what it
  calls the body, and unverified-oar-title means nobody has established a statutory name and name still
  holds the OAR chapter title it was scraped with, unchanged (#168). The two are never the same state,
  and --check reports both counts on every run: a row quietly keeping its OAR title under a field that
  means `statutory name` is a false statement about Oregon law published under provenance. Which of the
  two a row is decides what --refresh does to its name, so name is neither scraped nor curated: an established
  name is carried across untouched, and an unverified one is rebuilt from the chapter page so an upstream
  retitle reaches it. oar_name is the OAR name — the chapter page''s own title, which is the string OAR-derived
  joins must match; it is scraped, so an upstream chapter retitle moves it. raw_index_name is a different
  string: the index''s own abbreviated spelling. das_agency_number, where present, is the three-digit
  number DAS assigns the body in the Oregon Accounting Manual (OAM 70.10.00) — it identifies the body
  in the state''s financial administration and is not evidence that the body spends money, and it is what
  the oregon-budget corpus joins on; it is hand-reviewed (src/link_budget_codes.py), is NOT scraped from
  the source above, and is preserved across --refresh. Its absence on an entry means no counterpart was
  found, not that none was sought. relations, on every row, is where each body''s placement under another
  is recorded (ADR 0004): a target slug, the source whose evidence places it there, a kind, and — where
  one has been established — the authority that makes it true. It REPLACED parent_slug, which this registry
  no longer carries (#174): a bare parent slug could not say whose reading a placement was, which of ADR
  0004''s two kinds it is, or on what authority. A kind other than undetermined also records the BASIS
  it was derived from, which is a different fact from the source: the source says who places this body
  under that one, the basis says what settled which of ADR 0004''s two kinds it is, and a relation the
  OAR index discovered can have its kind decided by a statute. The two bases are not the same strength.
  proposed-enabling-authority means the kind was derived from a CANDIDATE in _meta/catalog/enabling-authority-review.yml
  that nobody has read — a proposal, not evidence — and the row upgrades to reviewed-enabling-authority
  when the review lands (ADR 0004 records this deviation and why it was taken). Only administered_by is
  derived: the absence of a candidate is never read as evidence that a body is part_of anything, so a
  relation nothing speaks to stays undetermined, which is the answer and not a gap. The kind is never
  guessed, and --check reports every kind, every source and every basis with its count on each run. Kinds
  are written by ONE thing, src/derive_relation_kinds.py, and carried across a --refresh per key: the
  scrape rebuilds the placement and the decision rides along. A body may hold more than one relation,
  because the OAR index, DAS and statute may place it under different parents and the disagreement is
  kept rather than reconciled (ADR 0003). MIXED ORIGIN, which is why the field is neither scraped nor
  curated: entries whose source is oar-index are REGENERATED by --refresh from the index tree, so an upstream
  re-filing reaches this file, and every other entry is carried across untouched. A manual row''s placement
  is sourced `registry` and never `oar-index`: the index does not carry that body, so it has placed it
  nowhere and no refresh can rebuild the entry. An empty list means this registry places the body under
  no other. budget_agency_code is the same number under the name it used to carry, readable for one deprecation
  cycle (ADR 0003); the two always hold the same value. enabling_authority, where present, is what created
  the body — an ORS citation, a constitutional article, or an executive order (ADR 0003) — or `none: `
  and the reason there is none. It is hand-reviewed (src/link_enabling_authority.py), is NOT scraped,
  and is preserved across --refresh. An ABSENT enabling_authority means nobody has reviewed this body
  yet; it never means the body has no enabling authority, which is what the `none: ` form says and says
  with a reason. oar_chapter is the OAR chapter this body''s rules are filed under, scraped from the index
  tree; null on the chapterless rows is not a gap — a body is in this registry because it EXISTS, not
  because it issues rules. source_url is the chapter page each row was scraped from, where the scrape
  found one: null on 15 of the 20 chapterless rows, not all of them — the other five hold a source_url
  that is not a chapter page (four hold the mirror''s own rules index, https://oregon.public.law/rules,
  and the manual saif-corporation row holds its own site). aliases, where present, are other names the
  same body is known by, including former names after a rename — hand-reviewed once, curated, and preserved
  across --refresh. note is scrape-only (#178): cmd_refresh() writes one of exactly three sentences into
  it, when a chapter page''s title will not parse, its fetch fails, or a chapterless group''s children
  disagree on a name prefix, and nothing else may live there, `manual` or not. curator_note holds hand-typed
  prose about a row instead, protected across --refresh the way das_agency_number is; the two rows carrying
  one today record why the row is `manual` at all, since the mirror''s index omits the chapter. This paragraph
  is itself checked against FIELDS by name on every --check run (`note-covers-fields`, #185): a field
  FIELDS declares that these sentences do not mention fails the gate, so this note cannot go stale the
  way it did before anything watched it.'
