name: validate-frontmatter

# PRs and pushes validate only the CHANGED files (corpus-toolkit's reusable workflow
# branches on github.event_name itself); the full-corpus frontmatter validation plus
# every generated-file staleness gate below run nightly + on manual dispatch — at
# ~69k files they blow past a reasonable per-PR budget.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 8 * * *"   # nightly full-corpus audit
  workflow_dispatch:

jobs:
  frontmatter:
    uses: OregonAI/corpus-toolkit/.github/workflows/validate-frontmatter.yml@v1.31.1
    with:
      # Pin the CODE, not just the workflow file. Omitting this used to
      # silently install v1.0.5 regardless of the tag above.
      toolkit-ref: v1.31.1
    # jobs: left unset — the CLI auto-detects the runner's own cpu_count rather than
    # a hardcoded worker number, so this scales automatically with whatever runner
    # (GitHub-hosted or self-hosted) actually executes it.

  # generated-views IS A FAN-IN GATE, NOT A JOB THAT RUNS ANYTHING ITSELF (#268).
  #
  # This used to be one job running every gate below serially: 38.8 minutes against a
  # 60-minute cap on 2026-08-26 (#267 raised that cap from 30 after the job was hitting it
  # and being CANCELLED -- worse than failing, because `cancelled` reads as somebody's
  # choice and nothing on `main` had actually completed this sweep for two days while the
  # gate count grew from 55 to 71). Headroom that only shrinks as the corpus grows is not a
  # fix, and branch protection requires a check named literally `generated-views`
  # (`gh api repos/OregonAI/executive-regulatory-frameworks/branches/main/protection` --
  # contexts: ["frontmatter / validate", "verify / verify", "generated-views"]), so
  # splitting the job by renaming it would strand every PR, including the one doing the
  # split, on a check that no longer reports.
  #
  # So the NAME stays. What changed is what runs under it: the gates are sharded into
  # `generated-views-shard-1..5` (parallel jobs below, cost-balanced by
  # `.github/generated-views-manifest.yml`), and `generated-views` itself does nothing but
  # depend on all five and assert every one succeeded. The required check still reports,
  # under the same name, on every PR -- no branch-protection edit, no transition window.
  #
  # THE TRAP: a plain `needs:` job is SKIPPED when an upstream job fails, and a skipped
  # required check does not report a failure -- which is exactly the "cancellation reads as
  # somebody's choice and nobody investigates" failure mode above, one layer up. That is why
  # the fan-in step (bottom of this file) is `if: always()` and reads each shard's
  # `needs.*.result` explicitly rather than trusting the job to be skipped only when
  # nothing is wrong: it goes red on shard failure, shard cancellation, AND shard skip
  # alike.
  #
  # THE MANIFEST IS THE ENFORCEMENT, not just documentation: `.github/generated-views-
  # manifest.yml` lists every PR-tier gate below with its measured local seconds and the
  # shard it is bin-packed into (longest-processing-time-first, `src/
  # shard_generated_views.py --plan N`), and that script's `--check` (run as its own gate,
  # below) fails if a gate here has no manifest entry, if a manifest entry names a gate
  # nothing here runs, if a manifest's stated shard disagrees with where the gate actually
  # lives, or if a shard job exists that `generated-views` does not depend on. A gate
  # silently dropped during a future re-shard is what this catches, rather than relying on
  # a reviewer to notice a missing line in a 700-line YAML diff.
  #
  # MEASURED, local warm checkout, 2026-08-28 (each of the 65 PR-tier gates timed for
  # real, individually, then bin-packed by `src/shard_generated_views.py --plan 5`):
  # 760.4s serial, 12.67 min -- well under the job's own prior comment's "22.4 minutes for
  # 71 gates" (2026-08-25), because that older figure was for a run that also counted
  # nightly-only gates (e.g. `Review queue must be current`, 159.2s on its own). Nightly
  # gates never ran on a PR to begin with, and #268 is explicit that they stay out of
  # scope here -- they are sharded separately, below, and carry no PR-tier budget.
  #
  # UPDATED by a code-review follow-up to #268, same day: the two llms.txt gates
  # (`llms.txt must be current` / `...and what we publish must name every chapter we
  # mirror`) were pinned to the same shard, sharing one combined invocation,
  # `build_llms.py --check --selftest`, but still kept as TWO steps -- the second an
  # unconditional `echo`, a gate that could no longer fail (AGENTS.md: "worse than no
  # gate, because it looks like evidence"). They are now genuinely one step and one
  # manifest entry, `llms.txt must be current, and name every chapter we mirror`
  # (86.7s, the combined measured cost -- build_llms.py's build() walks the whole
  # corpus and used to pay that cost twice as two separate CI steps, ~173.6s). Current
  # total: 64 PR-tier gates, 673.5s serial, 12.23 min. Bin-packed across 5 shards:
  # makespan (slowest shard) 141.9s local, ~4.0 CI-minutes at the measured 1.7x
  # slowdown -- against the old job's 38.8 CI-minutes, and flat as gates are added from
  # here, since wall-clock is now set by the slowest shard rather than the sum of all
  # of them.
  #
  # BUDGET AS A RED GATE, NOT A CANCELLATION (#268's explicit ask): every gate step below
  # carries its own `timeout-minutes`, computed from its measured seconds with a generous
  # margin (3x measured, scaled for CI's 1.7x slowdown, minimum 2 minutes) -- a gate that
  # runs long fails under ITS OWN NAME, in the Actions UI, rather than the whole shard
  # timing out anonymously. Each shard job also carries a generous job-level
  # `timeout-minutes` as a backstop only, per #268 ("a hard timeout-minutes on a job that
  # legitimately grows is a check with a hidden expiry date") -- it exists to catch a hang
  # no single step's timeout would (e.g. a step blocked on stdin), not to be the thing that
  # ordinarily fires.

  generated-views-shard-1:
    runs-on: ubuntu-latest
    # 18 gate(s), 141.9s measured locally (warm checkout) -- see .github/generated-views-manifest.yml.
    # (14 timed gates at 134.4s -- #307 moved one of them, "Legal status must be written
    # once and read everywhere else", from 4.8s to 6.4s: it now also reads every committed
    # rule document once for the two document-level censuses that ticket added -- plus this
    # shard's own two shard-manifest-coverage gates, ~0.1s each, added after the timing
    # pass, plus #306's stated-census pair, also grown by #307's new namespaces (6.0s + 0.1s
    # -> 7.2s + 0.1s), bin-packed here as the least-loaded shard by measured cost at the
    # time -- see the first two and the last two steps below.)
    #
    # 45: comfortably above the 38 minutes of summed per-step timeout-minutes below, plus
    # setup -- a code-review follow-up to #268 found every shard's job cap SMALLER than its
    # own step budget, which means a broad slowdown (the exact "wall-clock grows with the
    # gate count" scenario #268 is about) trips this cap before any single step can, and the
    # run reports `cancelled` with no gate named -- the outcome #268's last acceptance
    # criterion forbids. This cap is a backstop for a genuine hang only (e.g. a step blocked
    # on stdin); it should not ordinarily be the thing that fires.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # some of these scripts read git history
      - uses: ./.github/actions/generated-views-setup
      # THE SHARD SPLIT'S OWN GATE (#268), living here rather than in the fan-in job so
      # that job stays pure (its only work is depending on the shards and asserting their
      # results, as the ticket asks). Fails the run if a gate below (in ANY shard) has no
      # entry in .github/generated-views-manifest.yml, if a manifest entry names a gate no
      # shard runs, if a manifest's stated shard disagrees with where the gate actually
      # lives, or if a shard job exists that `generated-views` does not depend on -- the
      # "no gate silently dropped during a split" criterion, enforced here rather than
      # relying on a reviewer to notice a missing line in this file's diff.
      - name: The generated-views shard manifest must cover every gate, once
        timeout-minutes: 2
        run: python3 src/shard_generated_views.py --check
      - name: ...and that rule must be able to fail (shard manifest coverage)
        timeout-minutes: 2
        run: python3 src/shard_generated_views.py --selftest
      # The Oregon Constitution is mirrored WHOLE (ADR 0005, #195), and a section is
      # published only when its slice passed every rule — missing, not anchored to the title
      # the page lists, printed as a repealed section's leadline and history bracket alone,
      # too little text under the leadline, or printed twice with text under more than one
      # print, which nothing in the citation can tell apart. Each rule fires here against a
      # synthetic page, and the end-to-end proof is that a deliberately broken slice leaves
      # NO document behind: a skip that silently published would put text under a citation
      # that does not name it.
      #
      # ALSO PROVED HERE, because the whole document is what showed them: an article is found
      # by its WHOLE designation (ARTICLE VII is printed twice, as (Amended) and (Original),
      # and both are operative); a section number printed more than once resolves to the
      # print carrying text, which is FIRST in Article IV and LAST in Article XIV; and a
      # section number may carry an uppercase suffix (Article XI section 11L is the only one,
      # and a lowercase-only pattern did not skip it — it could not see it).
      #
      # AND SINCE #197, the drift report's own rules: a changed section is NAMED and an
      # unchanged one is not (a report that fires on everything says exactly what the one
      # sha256 already said), a section that cannot be sliced out of the candidate page is
      # reported as COULD NOT CHECK and never as deleted, and a `constitution/` that does not
      # carry what the catalog claims makes the report REFUSE rather than compare two
      # snapshots and call it a clean bill of health for documents that are not there.
      - name: Constitution ingest skip rules must all be able to fail
        timeout-minutes: 2
        run: python3 src/ingest_constitution.py --selftest
      # THE CATALOG IS THE LIST OF WHAT SHOULD EXIST, and that is only worth something if
      # something reads it back. Without this, a document deleted from constitution/ is
      # MERELY ABSENT: a citation to it falls through to the framework's generic
      # "unresolved", which is the answer a WRONG citation gets, and ADR 0005 exists to keep
      # those two apart. It is also the byte-identity gate — every published document is
      # re-rendered from the committed snapshot and compared, so a re-run cannot silently
      # rewrite what is committed. No network: it refuses to run if the snapshot is absent.
      - name: The Constitution catalog must match what is on disk
        timeout-minutes: 2
        run: python3 src/ingest_constitution.py --check
      # ONE PAGE MEANS ONE HASH (#197). The group's upstream signal is a single sha256 over
      # the whole document, so an amendment anywhere moves it and the signal says SOMETHING
      # changed and never WHAT — the diff has to do that work, and `--drift` is it. Run here
      # against the COMMITTED snapshot, where the honest answer is that nothing moved: a
      # drift report that fires on an unchanged page is not a drift report, and that is the
      # half most easily "passed" by a check that cannot tell a changed section from an
      # unchanged one. The other half — a mutated page naming the sections that moved, and
      # a section that could not be sliced reported as could-not-check rather than as
      # deleted — is proved failing in the selftest above. No network: it compares a
      # committed file against the committed snapshot, and refuses to answer at all if
      # constitution/ does not carry what the catalog claims.
      - name: The Constitution drift report must be silent on the committed snapshot
        timeout-minutes: 2
        run: python3 src/ingest_constitution.py --drift _meta/snapshots/oregon-constitution.txt
      # The Oregon Bulletin reader applied nine rules — three refusals, three reported
      # filing failures, and the parsing distinctions that keep a cited rule number from
      # being read as a changed one — and not one of them had ever been watched fail
      # (#226). All of them now fire against synthetic bulletin pages and synthetic
      # filing text, together with the rules `--check` applies to the committed
      # worklist. The two that matter most are the ones that would otherwise produce a
      # CONFIDENT ZERO: an index page whose layout moved and a bulletin page with no
      # filings table both yield "no filings", which is also what a quiet month yields.
      # Synthetic fixtures, no network, no read of the committed worklist.
      - name: Bulletin reader rules must all be able to fail
        timeout-minutes: 2
        run: python3 src/check_bulletin.py --selftest
      # The last of ADR 0006's series, and the only one that ACTS OUTWARD: the reader runs
      # on a cron and files an issue. So the rules that bound it are the ones proved here —
      # one issue per run and never one per rule (549 rule actions against a 25-issue cap),
      # and NO issue at all from a run holding no finding, fired in BOTH directions because
      # a `should_file` that always says no satisfies the criterion by reporting nothing
      # ever. The rule that matters most is the one #244 is currently firing: when the moved
      # share of the compared sources exceeds a fifth, the run reports ONE group-wide move
      # and refuses to name the rules — because a stale baseline manufactures the loud case
      # in bulk, and ~484 confident "changed with nobody announcing it" claims about rule
      # text nobody observed is the manufactured-absence failure inverted. Fired on a
      # 100-of-100 run and on a 1-of-100 run, so the guard is watched refusing AND watched
      # not swallowing the finding it exists for. The cadence and "hashing still runs
      # beside this" are read off the committed workflow FILES, after being fired on
      # synthetic ones. Synthetic fixtures and a temp drift file, no network.
      - name: The monthly Bulletin report must file one issue, or none
        timeout-minutes: 2
        run: python3 src/bulletin_report.py --selftest
      # Inventory only -- resolution against siblings is deliberately not compared, because
      # it changes when federal-reference publishes and no PR here causes or fixes that.
      - name: External-citation catalog must be current
        timeout-minutes: 8
        run: python3 src/scan_external_citations.py --check
      - name: Semantic topic map must be current (reads committed UMAP cache)
        timeout-minutes: 2
        run: python3 src/build_topic_map.py --check
      - name: Governor-priorities dataset must match the graph
        timeout-minutes: 2
        run: python3 src/build_governor_priorities_data.py --check
      - name: Conflict-candidates dataset must match the graph (verifies every citation)
        timeout-minutes: 2
        run: python3 src/build_conflict_candidates_data.py --check

      # #247: the manifest holds 484 individual rule pages in 4 chapters -- 1.3% of the
      # mirror -- and shares no rule with the Bulletin's worklist, so two of ADR 0006's
      # four cases cannot occur. The ADR said otherwise. This holds it to the manifest.
      - name: ADR 0006 must say what the OAR hash watch actually covers
        timeout-minutes: 2
        run: python3 src/oar_watch_coverage.py --check
      - name: ...and that rule must be able to fail (Bulletin-named rules watched)
        timeout-minutes: 2
        run: python3 src/seed_oar_watch.py --selftest
      # `enabling_authority` is written by ONE thing — the hand-reviewed MAPPED/UNMAPPED
      # tables in link_enabling_authority.py — and this verifies the registry against them
      # in both directions, plus every citation against the mirrored ORS, the mirrored
      # executive orders and, since #196, the mirrored Oregon Constitution. All three of ADR
      # 0003's forms resolve against a document; none is taken on form alone, which is what
      # closes the hole `Or. Const. Art. XVII, sec. 99` used to walk through. It can fail
      # while both tables are empty: a row that acquired an authority any other way is
      # reported, which is the drift a single writer exists to prevent.
      # ~10 s; reads committed data only, no network.
      - name: Enabling authorities must match the reviewed table
        timeout-minutes: 2
        run: python3 src/link_enabling_authority.py --check
      # The monthly OAR re-ingest worklist, audited against what this corpus actually
      # holds: every rule it marks held has a document and is named by the OAR catalog,
      # every rule it marks not-held has neither, and the file says which bulletin
      # produced it and when. The staleness rule is the one with teeth — a worklist
      # whose bulletin predates the OAR group's own last look upstream has left filings
      # unread, and a repeal among them is served here as though nothing had happened.
      # ~4 s over all 36,953 rules; reads committed data only, no network — the fetching
      # stays behind the mode that already did it.
      - name: Bulletin worklist must hold up against the corpus
        timeout-minutes: 2
        run: python3 src/check_bulletin.py --check
      # The same arrangement, against committed data: exactly one module in src/ writes a
      # legal status, every other write of one says which corpus it belongs to, and the two
      # fields spelled `status` hold each other's vocabulary nowhere across all 37,007 OAR
      # catalog rule entries — the document's `status` is whether a rule is IN FORCE and the
      # catalog's is whether THIS MIRROR holds a copy (CONTEXT.md keeps two entries for
      # exactly this). Where the catalog states a Bulletin-set `legal_status`, the document
      # must agree — 100 rows since #229, the 66 repeals and 34 suspensions the August 2026
      # bulletin filed against rules this corpus holds, and `--check` prints the count by
      # ACTION on every run so 34 suspensions cannot become 34 repeals with the total
      # unchanged. It also reads the committed worklist and fails if a filed repeal or
      # suspension is NOT recorded, which is the half no rule about an existing row can
      # state: strip the keys off all 100 and every other rule here passes on a corpus
      # serving repealed rules as current. ~4 s, reads committed data only, no network.
      - name: Legal status must be written once and read everywhere else
        timeout-minutes: 2
        run: python3 src/legal_status.py --check
      # A number written in CONTEXT.md's prose against the measurement that produces it
      # (#306): five figures went stale there while every generated view stayed current
      # (#304), the fifth hand sweep of one shape -- an anchored `<!--census:ns.key-->` tag
      # gates a figure against a live measurement, an `<!--observed:DATE-->` mark accepts one
      # that is a dated, closed fact and never gates it, and every figure in the glossary
      # must carry one or the other or the run refuses. Proving itself against the real
      # corpus rather than a fixture found and fixed a sixth stale figure this ticket's own
      # hand sweeps never suspected -- CONTEXT.md's *Hash observation* entry had drifted from
      # a 484-page, four-chapter manifest to 6,614 pages across 136, unnoticed because nothing
      # read the glossary the way `oar_watch_coverage.py`'s own gate reads the ADR. Also
      # carries #305's follow-on: a docstring citing CONTEXT.md as authority for a refusal
      # must name a glossary term CONTEXT.md actually has. ~6 s, reads committed data only
      # (the OAR and agency catalogs, the OAR hash-watch manifest and worklist), no network.
      - name: A stated figure must be gated against the census that produces it
        timeout-minutes: 2
        run: python3 src/stated_census.py --check
      - name: ...and that rule must be able to fail (stated-figure census)
        timeout-minutes: 2
        run: python3 src/stated_census.py --selftest

  generated-views-shard-2:
    runs-on: ubuntu-latest
    # 15 gate(s), 132.9s measured locally (warm checkout) -- see .github/generated-views-manifest.yml.
    # 45: see shard-1's comment -- comfortably above this shard's own summed per-step budget.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # some of these scripts read git history
      - uses: ./.github/actions/generated-views-setup
      # A re-analysis must never delete a prior run's candidates. The merge used to
      # replace an already-covered chapter's list wholesale, so a weaker model silently
      # destroyed findings a stronger one produced — 25 of 137 would have gone in a
      # planned 12B pass, with the run reporting success. Synthetic fixtures: no model,
      # no network, no catalog write.
      - name: Conflict-coverage ledger must be current
        timeout-minutes: 2
        run: python3 src/build_conflict_coverage.py --check
      - name: Triage write path must lose nothing
        timeout-minutes: 2
        run: python3 src/triage_conflicts.py --selftest
      # The other half of ADR 0006's split, and the caller that made the gate above
      # necessary. `adopt`/`amend`/`renumber` change a rule's TEXT and re-ingest with
      # nobody approving them; `repeal`/`suspend` change its FORCE and reach a person.
      # This proves the split can fail — a verb classified as both, a verb classified as
      # neither, a verb classified here that the bulletin reader never emits — and that a
      # re-ingest refuses everything that is not the amendment the bulletin filed: OARD
      # unreachable, a page serving a different rule number, a page with no rule on it.
      # The two rules about provenance and the byte-identical re-run are fired against
      # COMMITTED documents with a MUTATED COPY held in memory, so they are watched
      # failing on the corpus they govern without writing to the working tree. Synthetic
      # bulletins and an injected fetcher, no network.
      - name: Amendments must re-ingest without reaching a rule out of force
        timeout-minutes: 2
        run: python3 src/reingest_oar.py --selftest
      # This one was missing, and its absence was not cosmetic: the disposition catalog fell
      # 3,608 sections behind when a statute ingest landed without regenerating it, and the
      # live MCP server spent that time answering "no such document exists" for statutes
      # that were merely repealed — the exact confusion _resolve_ors exists to prevent.
      # Cheap and purely local (it reads committed snapshots), so it belongs in the
      # every-run tier rather than the nightly one.
      - name: ORS disposition catalog must be current
        timeout-minutes: 2
        run: python3 src/build_ors_disposition.py --check
      # THE SHARED BUILD (#268): this step now runs both llms.txt proofs
      # (--check and --selftest) in ONE process, so build_llms.py's build()
      # -- a full corpus walk -- is paid once here rather than once per
      # step. Measured: ~86.7s combined vs ~173.6s as two separate steps.
      #
      # This USED to be two steps, the second an unconditional `echo` kept only so its
      # gate name still appeared in the Actions UI and the manifest -- a code-review
      # follow-up to #268 flagged that as a gate that can no longer fail (AGENTS.md:
      # "A gate that cannot fail is worse than no gate, because it looks like
      # evidence."). The substance was never lost -- build_llms.py --selftest ran here
      # the whole time -- so this rename is the fix: one step, one name that says it
      # carries both proofs, one manifest entry, so a regression in either proof
      # reports under a name that is actually running it rather than under its
      # neighbour's.
      - name: llms.txt must be current, and name every chapter we mirror
        timeout-minutes: 8
        run: python3 src/build_llms.py --check --selftest
      - name: Policy-documentation-gap view must be current
        timeout-minutes: 2
        run: python3 src/build_policy_gap.py --check
      - name: Regulatory-freshness dataset must match the graph
        timeout-minutes: 2
        run: python3 src/build_freshness_data.py --check
      - name: Regulatory-freshness visualization must be current
        timeout-minutes: 2
        run: python3 src/build_freshness.py --check

      # #253: a document publishes its source hash TWICE and corpus-verify-provenance
      # reads only one. #244 left 36,952 provenance lines quoting a hash of nothing and
      # every gate stayed green.
      - name: A document's two spellings of its source hash must agree
        timeout-minutes: 2
        run: python3 src/provenance_spelling.py --check

      # #251: OARD serves a search-results list when a rule number is ambiguous. 39
      # documents published one as the rule. Recorded, not deleted -- ADR 0006.
      - name: A document mirroring an OARD results list must be recorded as one
        timeout-minutes: 2
        run: python3 src/results_page_documents.py --check

      # #256: the watched set is seeded FROM the worklist, so all four of ADR 0006's cases
      # are reachable. This fails the moment the worklist moves and the manifest is not
      # re-seeded -- which is the forcing function, since the worklist refresh is manual.
      - name: Every rule the Bulletin named and this corpus holds must be watched
        timeout-minutes: 2
        run: python3 src/seed_oar_watch.py --check
      - name: Agency registry must keep its contract
        timeout-minutes: 2
        run: python3 src/catalog_agencies.py --check

      # #237/#236/#241: the catalog names the chapters the registry and rules/ agree on,
      # a division's status is what its rules say, and the file's note keeps what was
      # appended to it. Three records that could disagree with what they describe.
      - name: The OAR catalog must agree with the registry, the disk, and its own rules
        timeout-minutes: 2
        run: python3 src/catalog_agreement.py --check
      # The committed schema's `recheck` node against the declaration it is generated from,
      # plus every source group's declared cadence against it. Reads committed data only
      # (the schema and _meta/sources/*.yml), no network.
      - name: Recheck cadences must be declared once, and every group must validate
        timeout-minutes: 2
        run: python3 src/check_updates.py --check
      # The same report against committed data, and the half no rule about its shape can
      # state: the issue body must NAME every one of the 121 rules missing from a chapter
      # this corpus mirrors and every filing the reader could not open, because a report
      # that dropped them passes every other rule here and tells a reader the month was
      # clean. It also fails if `.github/workflows/bulletin-report.yml` stops scheduling
      # this reader monthly after the Bulletin's first business day, if its cron and this
      # module's `CRON` disagree, if `scheduled.yml` stops hashing the `oar` group (ADR
      # 0006 keeps hashing for the one job it alone can do), or if corpus-toolkit renames
      # `changed-sources.tsv` out from under the reader — which would report NO HASH
      # OBSERVATION forever, indistinguishable from a corpus where nothing ever moves.
      # ~1 s; reads committed data only, no network, and files nothing.
      - name: The Bulletin report must carry what it counts, on the Bulletin's cadence
        timeout-minutes: 2
        run: python3 src/bulletin_report.py --check
      # A section is admitted only on evidence it is THIS section, not merely that its slice
      # contains a word the catalog title also uses (#201) -- checked by POSITION against the
      # catchline ORS itself prints, not by vocabulary. A stopword list would have been a
      # second opinion nobody can check.
      - name: ORS ingest title-anchoring check must refuse a one-shared-word mis-anchor
        run: python3 src/ingest_ors.py --selftest

  generated-views-shard-3:
    runs-on: ubuntu-latest
    # 10 gate(s), 132.9s measured locally (warm checkout) -- see .github/generated-views-manifest.yml.
    # 35: see shard-1's comment -- comfortably above this shard's own summed per-step budget.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # some of these scripts read git history
      - uses: ./.github/actions/generated-views-setup
      # The citation schemes' own proofs, and the half that matters is the refusals: an
      # `Or. Const.` citation to a section the page does not print must resolve to NOTHING
      # and say so, never to the article or to a neighbouring section. It holds apart the
      # answers a reader would otherwise have to guess between — printed but not published,
      # printed nowhere, an article printed with no sections at all, and a numeral the page
      # prints only WITH a parenthetical, where naming one of the two would be a coin flip.
      #
      # IT IS ALSO THE GATE ON THE ONE DECLARATION (#195). What a constitutional citation
      # looks like used to be written twice — the `or-const` scheme and AUTHORITY_FORMS — and
      # the two disagreed in both directions. Both now interpolate one token in repo_lib, and
      # `article_form_disagreements()` runs every designation the catalog holds through both.
      # The gate is watched failing here against the form as it stood before that change.
      #
      # FOUR OF ITS PROOFS NOW RUN AGAINST A LIVE `CorpusFramework`, which is why this is a
      # PER-PR step and not only part of the nightly MCP smoke test below: the PR that
      # changes a scheme is the one that can break it, and every unit-level proof above
      # still passes while the served resolver answers "no citation scheme recognized this
      # format" (#202's trap, hit while this scheme was being written, then reproduced a
      # second time inside its own fix). Two go all the way through `resolve_citation`
      # (end-to-end resolution, and every flagged scheme surviving registration); the
      # federal-scheme proof deliberately stops at `_match_schemes` instead, because its
      # candidates live in the `federal-reference` sibling and resolve over the network,
      # which this step should not depend on to stay green; the registration-storage proof
      # reads `fw.schemes` directly and calls neither. None of the four need the network.
      # ~85 s: the unresolved cases exercise resolve_citation's search fallback, which
      # builds the FTS index from scratch on a fresh checkout.
      - name: Citation schemes must resolve, and refuse, what they claim
        timeout-minutes: 8
        run: python3 src/citation_schemes.py --selftest
      # The registry's own contract, and every rule in it fires on a synthetic registry
      # built to break exactly one — a gate nobody has watched fail is not known to work.
      - name: Agency-registry contract rules must all be able to fail
        timeout-minutes: 2
        run: python3 src/catalog_agencies.py --selftest
      # The measurement side of the same pipeline, and its failures are quieter than the
      # merge's: a recall number computed against the wrong ground truth, or a per-type
      # table built from hand labels attached to the wrong candidates, is a confident
      # wrong answer rather than an error. Positional labels were landing on the correct
      # candidate for 4 of 137 (#64) with nothing to show for it. Needs full git history
      # — it re-derives the labels from the labelling commit — which this job already
      # checks out (fetch-depth: 0).
      - name: Conflict evaluation must measure against pinned ground truth
        timeout-minutes: 2
        run: python3 src/eval_conflicts.py --selftest

      # --- generated-file staleness gates (moderate; every run) ---
      # #242: a suspension is not a repeal. Watched failing against three mutations --
      # collapsing suspension into repeal, keeping repealed rules too, and an empty
      # catalog -- so the distinction cannot quietly regress.
      - name: A suspended rule keeps its authority edges, a repealed one does not
        timeout-minutes: 2
        run: python3 src/link_graph.py --selftest
      - name: Statute-operationalization view must be current
        timeout-minutes: 2
        run: python3 src/build_statute_fan.py --check
      - name: Policy-age visualization must be current
        timeout-minutes: 2
        run: python3 src/build_policy_age.py --check
      # The registry is the identity three sibling corpora crosswalk into, and every way
      # `catalog_agencies.py --refresh` has broken it was silent: curated fields dropped
      # because CURATED_KEYS did not list them, 13 manual rows dropped because a
      # null chapter looked like a collision. This replays a refresh against the committed
      # registry (no scrape, no network) and fails when a row or a curated field would not
      # survive it, plus the slug/chapter/parent rules of ADR 0003 and ADR 0004.
      # A SNAPSHOT'S IDENTITY IS SPELLED TWICE and the two spellings are not the same
      # function: `hash_snapshot` hashes the committed `.txt`, `content_hash` hashes the raw
      # source with volatile patterns stripped. `source_sha256` is WRITTEN with the second
      # and VERIFIED with the first, so they must agree -- and nothing enforced that.
      # Measured: adding corpus-toolkit#244's colophon pattern makes 36,953 of 37,524
      # snapshots disagree, and without this gate that surfaces as 36,953 provenance errors
      # naming the wrong cause. It took three wrong diagnoses to find. No network.
      - name: A snapshot's two spellings must agree
        timeout-minutes: 3
        run: python3 src/snapshot_identity.py --check
      # WHAT `name` MEANS IS ABOUT TO CHANGE (ADR 0003), and nothing in the data shows which
      # consumers depend on what it means: `name` and `oar_name` hold identical bytes on all
      # 189 rows, so a consumer that should have moved and did not looks exactly like one
      # that was checked. #187 read all 38 sites on `main` and recorded a classification
      # beside each of the 33 that still read `name` once its two joins had moved; this
      # keeps that true, by refusing a registry-name read that nobody has classified.
      # Source scan only — no registry read, no network.
      - name: Every registry-name read must be classified
        timeout-minutes: 2
        run: python3 src/name_readers.py --check
      # A relation's kind, basis and authority are written by ONE thing, and this verifies
      # the registry against that derivation in both directions — so a kind that arrived any
      # other way is reported, and so is a body whose candidate has been reviewed since the
      # last --apply, which is the row still recording a proposal after a human read it.
      # Reads committed data only (the registry and the review sheet), no network.
      - name: Relation kinds must match the derivation
        timeout-minutes: 2
        run: python3 src/derive_relation_kinds.py --check
      # The same arrangement from the re-ingest side, against committed data. Reads the
      # committed worklist and demands a re-ingest record for EVERY text action the
      # bulletin filed against a rule this corpus holds — 306 the month this landed — so
      # the gate cannot be satisfied by a corpus that re-ingested nothing, which is the
      # shape every rule about an existing row has. It also refuses the two things that
      # would undo #229: a row recording a re-ingest of a repeal or a suspension, and a
      # row carrying a Bulletin-set `legal_status` that this path wrote to at all. The
      # rows out of force are COUNTED by action on every run, beside the count of those
      # that also record a re-ingest, so a corpus that silently started re-ingesting them
      # is a number that moved rather than a sentence that stopped being true. Every
      # re-ingested document — every bulletin, not only the current one — is verified
      # against the snapshot committed beside it and
      # reproduced byte for byte by re-running the refresh over it, which is what makes
      # "re-running produces byte-identical output" a gate rather than an observation.
      # ~10 s; reads committed data only, no network.
      - name: Every amendment the Bulletin filed must be recorded as re-ingested
        timeout-minutes: 2
        run: python3 src/reingest_oar.py --check
      # Compares the INVENTORY only, not the whole file: `documents_scanned` is a denominator
      # that moves whenever any content file is added or dropped, and comparing it made the
      # gate fail on PRs that changed no citation at all (#158's shape, #210 review).
      - name: ORS chapter-gap catalog must be current
        run: python3 src/scan_ors_citations.py --check

  generated-views-shard-4:
    runs-on: ubuntu-latest
    # 23 gate(s), 222.7s measured locally (warm checkout, 2026-08-28) -- see .github/generated-views-manifest.yml.
    # 55: see shard-1's comment -- comfortably above this shard's own summed per-step budget.
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # some of these scripts read git history
      - uses: ./.github/actions/generated-views-setup

      # --- parser regression guards (fast; every run) ---
      # Signature-block dates are the single most OCR-damaged field in the corpus, and
      # a wrong date passes every other gate silently. Cases are real corpus lines.
      - name: Executive-order signed-date parser
        timeout-minutes: 2
        run: python3 src/ingest_eo.py --selftest
      - name: Conflict-catalog merge must not drop prior candidates
        timeout-minutes: 2
        run: python3 src/analyze_conflicts.py --selftest
      # The enabling authority is ADMITTING evidence (ADR 0003) — a citation alone can put
      # a body in the registry — so a wrong one is a false statement about Oregon law
      # published under provenance. Every rule its --check enforces fires here against a
      # synthetic table and a synthetic registry, which matters most right now: the
      # reviewed table is EMPTY, so the gate below has almost nothing of its own to say
      # yet, and an empty table is exactly when a quiet gate looks like a passing one.
      #
      # THE CONSTITUTIONAL CASES ARE THE EXCEPTION TO "SYNTHETIC" (#196), and they have to
      # be: the whole Constitution is mirrored, so the only citations that resolve are real
      # ones. Five of them resolve to nothing here, one per kind — no such article, an
      # article with no sections, no such section in it, a section printed and not published,
      # and a numeral naming two operative articles — and a sixth proof asserts that no two
      # of the five are given the same answer, because a row citing a section Oregon repealed
      # and a row citing one that never existed are different errors. Also proved failing:
      # an empty `constitution/` REFUSES to answer rather than reporting every constitutional
      # authority as citing nothing.
      - name: Enabling-authority rules must all be able to fail
        timeout-minutes: 2
        run: python3 src/link_enabling_authority.py --selftest
      # A relation's KIND is derived, and some of the decided kinds rest on candidates
      # NOBODY HAS READ rather than on a reviewed enabling authority (ADR 0004's amendment)
      # — the live split is `relation_census()`'s to print, on every `catalog_agencies.py
      # --check` run, rather than a figure pinned here to go stale. The whole defence of
      # that split is the `basis` recorded beside each kind, so the rules that keep the two
      # strengths apart — a kind with no basis, an `administered_by` citing nothing, a
      # candidate the registry cannot record — are the ones this proves can fail, against a
      # synthetic registry and a synthetic review sheet. It also proves the two things the
      # derivation must NOT do: derive a kind from the absence of a candidate, and leave a
      # reviewed row still recording a proposal.
      - name: Relation-kind derivation rules must all be able to fail
        timeout-minutes: 2
        run: python3 src/derive_relation_kinds.py --selftest
      # A cadence is what says when a group is rechecked, and it used to be written twice:
      # CADENCES in check_updates.py and the `recheck` enum in the source-group schema, with
      # nothing gating their agreement (#165's CURATED_KEYS, in a second place). The enum is
      # now derived from the table, and this proves the gate can fail: a cadence on one side
      # only, an interval the schema prints that the table no longer means, and a group
      # declaring a cadence nobody declared — which used to be a bare KeyError out of
      # report_due(), taking every other group's due-state down with it. Synthetic fixtures.
      - name: Cadence rules must all be able to fail
        timeout-minutes: 2
        run: python3 src/check_updates.py --selftest
      # A rule document's `status` is a claim about Oregon law and ADR 0006 gives it ONE
      # writer, the Oregon Bulletin. It had two: ingest_oar.py wrote `status: current` as a
      # hardcoded literal on every rule it created, and enrich_oar.py derived the field from
      # the rule's own History line AND compared it in a nightly gate. Once amendments
      # re-ingest automatically (#230) that literal resurrects a rule the Bulletin marked
      # repealed, silently, under provenance. Both now read `legal_status.resolve()` and this
      # proves the arrangement can fail: a second writer, a write nobody marked, a "reader"
      # that kept its own literal, and — the one this ticket exists for — a re-ingest that
      # overwrote a Bulletin-set status, which is fired against a COMMITTED rule document
      # rather than a fixture. It also fires the write itself: a repeal and a suspension go
      # through `mark()` onto a synthetic catalog and the two come out distinguishable —
      # flip the suspension's target to `repealed` and that is the case that goes red.
      # Synthetic sources, no network.
      - name: Legal status must have exactly one writer
        timeout-minutes: 2
        run: python3 src/legal_status.py --selftest

      - name: Relationship graph must be current
        timeout-minutes: 7
        run: python3 src/link_graph.py --check
      # The OAR honesty field (#78): every rule must say whether upstream drift
      # detection actually covers it (`manifest`) or nothing does (`none`), and the
      # values must match _meta/sources/oar.yml. ~2 s over all 36,953 rules.
      - name: OAR upstream_tracking field must match the source manifest
        timeout-minutes: 2
        run: python3 src/mark_upstream_tracking.py --check
      - name: Agency authority-graph visualization must be current
        timeout-minutes: 2
        run: python3 src/build_agency_graph.py --check
      - name: Authority-chain explorer must be current
        timeout-minutes: 2
        run: python3 src/build_authority_explorer.py --check
      - name: Semantic vector index must be current (soft-pass if not built)
        timeout-minutes: 2
        run: python3 src/build_embeddings.py --check
      # The DAS budget agency codes are a hand-reviewed mapping, not a scrape, and
      # `catalog_agencies.py --refresh` rebuilds every entry from oregon.public.law. This
      # catches a refresh that dropped them — which before CURATED_KEYS it silently did,
      # leaving a file that still parsed and every slug still resolving.
      - name: Budget agency codes must match the reviewed mapping
        timeout-minutes: 2
        run: python3 src/link_budget_codes.py --check
      - name: Snapshot-identity gate must be able to fail (selftest)
        timeout-minutes: 2
        run: python3 src/snapshot_identity.py --selftest
      - name: ...and that rule must be able to fail (source-hash spellings)
        timeout-minutes: 2
        run: python3 src/provenance_spelling.py --selftest
      - name: ...and that rule must be able to fail (OARD results-list documents)
        timeout-minutes: 2
        run: python3 src/results_page_documents.py --selftest
      - name: ...and that rule must be able to fail (OAR hash-watch coverage)
        timeout-minutes: 2
        run: python3 src/oar_watch_coverage.py --selftest
      - name: Registry-name classification gate must fire (selftest)
        timeout-minutes: 2
        run: python3 src/name_readers.py --selftest
      # The two OAR-derived joins that moved onto `oar_name` in #187, proven against a
      # registry whose two names DIFFER — which no committed row's do, so a proof read from
      # committed data would pass whichever field the code reads. Synthetic fixtures: no
      # network, no corpus scan (enrich_oar.py --check, the full-corpus half, runs nightly
      # below).
      - name: OAR enrichment stamps the OAR name (selftest)
        timeout-minutes: 2
        run: python3 src/enrich_oar.py --selftest
      - name: OAR discovery is keyed on the OAR name (selftest)
        timeout-minutes: 2
        run: python3 src/catalog_oar.py --selftest
      - name: ...and those rules must be able to fail
        timeout-minutes: 2
        run: python3 src/catalog_agreement.py --selftest
      # #276: two scrapers wrote _meta/catalog/oar.yml's division/rule membership --
      # catalog_oar.py --discover (OARD, guarded since #270) and ingest_oar.py
      # --enumerate (oregon.public.law, unguarded). Retiring the second rather than
      # teaching it the guard the first already has: this proves the negative that no
      # remaining path in ingest_oar.py can drop a catalogued row, by walking the
      # module's own AST for the exact shape that used to drop one.
      - name: OAR catalog membership has exactly one writer (selftest)
        timeout-minutes: 2
        run: python3 src/ingest_oar.py --selftest
      # Conflict candidates that need no model. A hand-labelled taxonomy of the 137
      # frontier-pilot candidates found 29% were of four deterministic types, and code
      # finds far more of them than the models did — the pilot reported 21 dead citations
      # in total, this scan finds 5,734. It was written, worked, and was wired into
      # nothing; the artifact could drift from the corpus indefinitely with no signal.
      # 55 seconds over all 36,953 rules, no network, no model.
      - name: Mechanical conflict findings must be current
        timeout-minutes: 5
        run: python3 src/detect_mechanical.py --check
      # A citation into a chapter this corpus does not mirror must state the ABSENCE, never the
      # generic unresolved answer a WRONG citation gets (#210). Its scanner reads \d{1,3}:
      # anchored on \d{2,3} it could not see single-digit chapters at all, which is a fifth
      # of the chapter space and includes chapter 2, real and unmirrored.
      - name: ORS chapter-gap classification must all be able to fail
        run: python3 src/scan_ors_citations.py --selftest

  generated-views-shard-5:
    runs-on: ubuntu-latest
    # 2 gate(s), 141.9s measured locally (warm checkout) -- see .github/generated-views-manifest.yml.
    # 20: see shard-1's comment. This shard's job cap was previously 12 against a 13-minute
    # summed step budget -- already inverted on day one, caught by the same review pass.
    # >= v1.22.0 required: earlier corpus-generate-status predates the M4 changes this
    # corpus's STATUS.md was first generated with.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # some of these scripts read git history
      - uses: ./.github/actions/generated-views-setup
      # STATUS.md derives from repo content, so a PR is exactly what can invalidate
      # it (oregon-audits' generated-job rationale). --check, not a raw diff: the
      # "Generated <date>" line is volatile by design.
      - name: STATUS.md must be current
        timeout-minutes: 6
        run: corpus-generate-status --config _meta/corpus.yml --output STATUS.md --check
      - name: Agency overview must be current
        timeout-minutes: 7
        run: python3 src/build_agency_index.py --check

  generated-views-nightly:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # 80: raised from 30 in the same code-review follow-up to #268 that fixed the PR-tier
    # shards' job caps -- #268's "budget as a red gate, not a cancellation" is stated for
    # "the sweep" as a whole, not scoped to the PR-tier half, and 30 was already below the
    # sum of the per-step timeouts just added below (~70 min, none of them individually
    # measured the way the manifest's PR-tier seconds are -- these are generous backstops
    # over full-corpus scans, not a re-timed budget). This cap is itself only a backstop
    # for a genuine hang, per the same reasoning as the PR-tier shards above.
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # some of these scripts read git history
      - uses: ./.github/actions/generated-views-setup

      # --- heaviest full-corpus scans: nightly / on-demand only ---
      # agency_profile selftest: scans every one of ~69k files' frontmatter with no
      # cross-process cache (its in-memory stats cache only helps a long-lived process
      # like the MCP server, not a fresh CI checkout), so it takes several minutes —
      # too slow for the per-PR fast tier, same tradeoff as review_queue/enrich_oar/
      # enrich_statutes below.
      - name: Agency profile engine selftest (nightly)
        timeout-minutes: 15
        run: python3 src/agency_profile.py --selftest

      - name: MCP query engine smoke test (nightly)
        timeout-minutes: 10
        run: |
          python3 -c "
          import sys
          from corpus_toolkit import config as config_mod
          from corpus_toolkit.mcp.framework import CorpusFramework
          config = config_mod.load('_meta/corpus.yml')
          fw = CorpusFramework(config)
          fails = []
          def check(name, cond):
              print(('PASS ' if cond else 'FAIL ') + name)
              if not cond: fails.append(name)
          r = fw.resolve_citation('OAR 125-800-0020')
          check('renumbered OAR citation resolves', any(m['id']=='oar-128-030-0020' for m in r['matches']))
          r = fw.resolve_citation('ORS 276A.300')
          check('ORS citation resolves', any(m['id']=='ors-276a.300' for m in r['matches']))
          r = fw.resolve_citation('Or. Const. Art. VI, sec. 1')
          check('constitutional citation resolves', any(m['id']=='orconst-art-vi-sec-1' for m in r['matches']))
          r = fw.resolve_citation('Or. Const. Art. VI, sec. 99')
          check('a section the page does not print resolves to nothing', r.get('unresolved') and not r['matches'])
          check('...and says the page prints no such section', 'no section 99' in (r.get('note') or ''))
          r = fw.get_document('oar-128-030-0020')
          check('get_document returns body + disclaimer', 'body' in r and r.get('disclaimer'))
          r = fw.corpus_overview()
          check('corpus_overview counts documents', sum(r['documents_by_type'].values()) > 60000)
          r = fw.issuing_body_profile('department-of-administrative-services')
          check('issuing_body_profile has real doc counts', isinstance(r.get('in_repo'), dict) and sum(r['in_repo'].values()) > 100)
          sys.exit(1 if fails else 0)
          "

      - name: Policy-age dataset must match the corpus (nightly; full-corpus scan)
        timeout-minutes: 10
        run: python3 src/build_policy_age_data.py --check

      - name: Review queue must be current (nightly)
        timeout-minutes: 10
        run: python3 src/review_queue.py --check

      - name: ORS frontmatter must match each statute's own history notes (nightly)
        timeout-minutes: 10
        run: python3 src/enrich_statutes.py --check

      - name: OAR frontmatter must match each rule's own structured lines (nightly)
        timeout-minutes: 15
        run: python3 src/enrich_oar.py --check


  generated-views:
    needs:
      - generated-views-shard-1
      - generated-views-shard-2
      - generated-views-shard-3
      - generated-views-shard-4
      - generated-views-shard-5
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Was six coordinated per-shard blocks (one echo + one `if` each) -- a code-review
      # follow-up to #268 flagged that as Shotgun Surgery: changing the shard count meant
      # editing this step AND the `needs:` list above in lockstep, by hand, with nothing
      # to catch a block left behind. `${{ toJSON(needs) }}` carries every job this job
      # `needs:` and its result, so looping over it makes the assertion shard-count-
      # agnostic -- a shard added or removed only ever requires editing `needs:` above.
      #
      # THE TRAP this preserves (#268's own): still `if: always()`, so the loop below still
      # runs and asserts on shard failure, cancellation, AND skip alike, rather than this
      # job itself being skipped when an upstream job fails.
      - name: Every shard must have succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          fail=0
          for job in $(echo "$NEEDS_JSON" | jq -r 'keys[]'); do
            result=$(echo "$NEEDS_JSON" | jq -r --arg j "$job" '.[$j].result')
            echo "$job: $result"
            if [ "$result" != "success" ]; then
              echo "FAIL  $job reported '$result', not success"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "generated-views is red: at least one shard did not succeed"
            echo "(failure, cancellation, and skip all count -- see #268)."
            exit 1
          fi
          n=$(echo "$NEEDS_JSON" | jq -r 'keys | length')
          echo "generated-views is green: all $n shard(s) succeeded."
