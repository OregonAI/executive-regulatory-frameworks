name: validate-frontmatter

# PRs and pushes validate only the CHANGED files (corpus-toolkit's reusable workflow
# branches on github.event_name itself); the full-corpus frontmatter validation plus
# every generated-file staleness gate below run nightly + on manual dispatch — at
# ~69k files they blow past a reasonable per-PR budget.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 8 * * *"   # nightly full-corpus audit
  workflow_dispatch:

jobs:
  frontmatter:
    uses: OregonAI/corpus-toolkit/.github/workflows/validate-frontmatter.yml@v1.28.0
    with:
      # Pin the CODE, not just the workflow file. Omitting this used to
      # silently install v1.0.5 regardless of the tag above.
      toolkit-ref: v1.28.0
    # jobs: left unset — the CLI auto-detects the runner's own cpu_count rather than
    # a hardcoded worker number, so this scales automatically with whatever runner
    # (GitHub-hosted or self-hosted) actually executes it.

  generated-views:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # some of these scripts read git history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      # corpus-toolkit for the STATUS.md gate below. THREE pins move together in this
      # file (reusable-workflow `uses:`, its `toolkit-ref:`, and this checkout) — same
      # trap oregon-audits documents in its generated job (corpus-toolkit#9).
      # >= v1.22.0 required: earlier corpus-generate-status predates the M4 changes
      # this corpus's STATUS.md was first generated with.
      - uses: actions/checkout@v4
        with:
          repository: OregonAI/corpus-toolkit
          ref: v1.28.0
          path: .toolkit
      - run: pip install ./.toolkit

      # --- parser regression guards (fast; every run) ---
      # Signature-block dates are the single most OCR-damaged field in the corpus, and
      # a wrong date passes every other gate silently. Cases are real corpus lines.
      - name: Executive-order signed-date parser
        run: python3 src/ingest_eo.py --selftest
      # The Oregon Constitution is mirrored WHOLE (ADR 0005, #195), and a section is
      # published only when its slice passed every rule — missing, not anchored to the title
      # the page lists, printed as a repealed section's leadline and history bracket alone,
      # too little text under the leadline, or printed twice with text under more than one
      # print, which nothing in the citation can tell apart. Each rule fires here against a
      # synthetic page, and the end-to-end proof is that a deliberately broken slice leaves
      # NO document behind: a skip that silently published would put text under a citation
      # that does not name it.
      #
      # ALSO PROVED HERE, because the whole document is what showed them: an article is found
      # by its WHOLE designation (ARTICLE VII is printed twice, as (Amended) and (Original),
      # and both are operative); a section number printed more than once resolves to the
      # print carrying text, which is FIRST in Article IV and LAST in Article XIV; and a
      # section number may carry an uppercase suffix (Article XI section 11L is the only one,
      # and a lowercase-only pattern did not skip it — it could not see it).
      - name: Constitution ingest skip rules must all be able to fail
        run: python3 src/ingest_constitution.py --selftest
      # The citation schemes' own proofs, and the half that matters is the refusals: an
      # `Or. Const.` citation to a section the page does not print must resolve to NOTHING
      # and say so, never to the article or to a neighbouring section. It holds apart the
      # answers a reader would otherwise have to guess between — printed but not published,
      # printed nowhere, an article printed with no sections at all, and a numeral the page
      # prints only WITH a parenthetical, where naming one of the two would be a coin flip.
      #
      # IT IS ALSO THE GATE ON THE ONE DECLARATION (#195). What a constitutional citation
      # looks like used to be written twice — the `or-const` scheme and AUTHORITY_FORMS — and
      # the two disagreed in both directions. Both now interpolate one token in repo_lib, and
      # `article_form_disagreements()` runs every designation the catalog holds through both.
      # The gate is watched failing here against the form as it stood before that change.
      #
      # ITS LAST PROOF RUNS THE WHOLE WAY THROUGH `CorpusFramework.resolve_citation`, which
      # is why this is a PER-PR step and not only part of the nightly MCP smoke test below:
      # the PR that changes a scheme is the one that can break it, and every unit-level
      # proof above still passes while the served resolver answers "no citation scheme
      # recognized this format" (#202's trap, hit while this scheme was being written).
      # ~85 s: the unresolved cases exercise resolve_citation's search fallback, which
      # builds the FTS index from scratch on a fresh checkout.
      - name: Citation schemes must resolve, and refuse, what they claim
        run: python3 src/citation_schemes.py --selftest
      # A re-analysis must never delete a prior run's candidates. The merge used to
      # replace an already-covered chapter's list wholesale, so a weaker model silently
      # destroyed findings a stronger one produced — 25 of 137 would have gone in a
      # planned 12B pass, with the run reporting success. Synthetic fixtures: no model,
      # no network, no catalog write.
      - name: Conflict-coverage ledger must be current
        run: python3 src/build_conflict_coverage.py --check
      - name: Triage write path must lose nothing
        run: python3 src/triage_conflicts.py --selftest
      - name: Conflict-catalog merge must not drop prior candidates
        run: python3 src/analyze_conflicts.py --selftest
      # The registry's own contract, and every rule in it fires on a synthetic registry
      # built to break exactly one — a gate nobody has watched fail is not known to work.
      - name: Agency-registry contract rules must all be able to fail
        run: python3 src/catalog_agencies.py --selftest
      # The enabling authority is ADMITTING evidence (ADR 0003) — a citation alone can put
      # a body in the registry — so a wrong one is a false statement about Oregon law
      # published under provenance. Every rule its --check enforces fires here against a
      # synthetic table and a synthetic registry, which matters most right now: the
      # reviewed table is EMPTY, so the gate below has almost nothing of its own to say
      # yet, and an empty table is exactly when a quiet gate looks like a passing one.
      - name: Enabling-authority rules must all be able to fail
        run: python3 src/link_enabling_authority.py --selftest
      # A relation's KIND is derived, and 44 of the 81 are derived from candidates NOBODY
      # HAS READ (ADR 0004's amendment). The whole defence of that is the `basis` recorded
      # beside each kind, so the rules that keep the two strengths apart — a kind with no
      # basis, an `administered_by` citing nothing, a candidate the registry cannot record —
      # are the ones this proves can fail, against a synthetic registry and a synthetic
      # review sheet. It also proves the two things the derivation must NOT do: derive a kind
      # from the absence of a candidate, and leave a reviewed row still recording a proposal.
      - name: Relation-kind derivation rules must all be able to fail
        run: python3 src/derive_relation_kinds.py --selftest
      # A cadence is what says when a group is rechecked, and it used to be written twice:
      # CADENCES in check_updates.py and the `recheck` enum in the source-group schema, with
      # nothing gating their agreement (#165's CURATED_KEYS, in a second place). The enum is
      # now derived from the table, and this proves the gate can fail: a cadence on one side
      # only, an interval the schema prints that the table no longer means, and a group
      # declaring a cadence nobody declared — which used to be a bare KeyError out of
      # report_due(), taking every other group's due-state down with it. Synthetic fixtures.
      - name: Cadence rules must all be able to fail
        run: python3 src/check_updates.py --selftest
      # The measurement side of the same pipeline, and its failures are quieter than the
      # merge's: a recall number computed against the wrong ground truth, or a per-type
      # table built from hand labels attached to the wrong candidates, is a confident
      # wrong answer rather than an error. Positional labels were landing on the correct
      # candidate for 4 of 137 (#64) with nothing to show for it. Needs full git history
      # — it re-derives the labels from the labelling commit — which this job already
      # checks out (fetch-depth: 0).
      - name: Conflict evaluation must measure against pinned ground truth
        run: python3 src/eval_conflicts.py --selftest

      # --- generated-file staleness gates (moderate; every run) ---
      - name: Relationship graph must be current
        run: python3 src/link_graph.py --check
      # The OAR honesty field (#78): every rule must say whether upstream drift
      # detection actually covers it (`manifest`) or nothing does (`none`), and the
      # values must match _meta/sources/oar.yml. ~2 s over all 36,953 rules.
      - name: OAR upstream_tracking field must match the source manifest
        run: python3 src/mark_upstream_tracking.py --check
      # STATUS.md derives from repo content, so a PR is exactly what can invalidate
      # it (oregon-audits' generated-job rationale). --check, not a raw diff: the
      # "Generated <date>" line is volatile by design.
      - name: STATUS.md must be current
        run: corpus-generate-status --config _meta/corpus.yml --output STATUS.md --check
      # This one was missing, and its absence was not cosmetic: the disposition catalog fell
      # 3,608 sections behind when a statute ingest landed without regenerating it, and the
      # live MCP server spent that time answering "no such document exists" for statutes
      # that were merely repealed — the exact confusion _resolve_ors exists to prevent.
      # Cheap and purely local (it reads committed snapshots), so it belongs in the
      # every-run tier rather than the nightly one.
      - name: ORS disposition catalog must be current
        run: python3 src/build_ors_disposition.py --check
      - name: llms.txt must be current
        run: python3 src/build_llms.py --check
      - name: Agency overview must be current
        run: python3 src/build_agency_index.py --check
      - name: Agency authority-graph visualization must be current
        run: python3 src/build_agency_graph.py --check
      - name: Policy-documentation-gap view must be current
        run: python3 src/build_policy_gap.py --check
      - name: Statute-operationalization view must be current
        run: python3 src/build_statute_fan.py --check
      # Inventory only -- resolution against siblings is deliberately not compared, because
      # it changes when federal-reference publishes and no PR here causes or fixes that.
      - name: External-citation catalog must be current
        run: python3 src/scan_external_citations.py --check
      - name: Authority-chain explorer must be current
        run: python3 src/build_authority_explorer.py --check
      - name: Semantic topic map must be current (reads committed UMAP cache)
        run: python3 src/build_topic_map.py --check
      - name: Regulatory-freshness dataset must match the graph
        run: python3 src/build_freshness_data.py --check
      - name: Regulatory-freshness visualization must be current
        run: python3 src/build_freshness.py --check
      - name: Semantic vector index must be current (soft-pass if not built)
        run: python3 src/build_embeddings.py --check
      - name: Policy-age visualization must be current
        run: python3 src/build_policy_age.py --check
      - name: Governor-priorities dataset must match the graph
        run: python3 src/build_governor_priorities_data.py --check
      - name: Conflict-candidates dataset must match the graph (verifies every citation)
        run: python3 src/build_conflict_candidates_data.py --check
      # The DAS budget agency codes are a hand-reviewed mapping, not a scrape, and
      # `catalog_agencies.py --refresh` rebuilds every entry from oregon.public.law. This
      # catches a refresh that dropped them — which before CURATED_KEYS it silently did,
      # leaving a file that still parsed and every slug still resolving.
      - name: Budget agency codes must match the reviewed mapping
        run: python3 src/link_budget_codes.py --check
      # The registry is the identity three sibling corpora crosswalk into, and every way
      # `catalog_agencies.py --refresh` has broken it was silent: curated fields dropped
      # because CURATED_KEYS did not list them, 13 manual rows dropped because a
      # null chapter looked like a collision. This replays a refresh against the committed
      # registry (no scrape, no network) and fails when a row or a curated field would not
      # survive it, plus the slug/chapter/parent rules of ADR 0003 and ADR 0004.
      - name: Agency registry must keep its contract
        run: python3 src/catalog_agencies.py --check
      # WHAT `name` MEANS IS ABOUT TO CHANGE (ADR 0003), and nothing in the data shows which
      # consumers depend on what it means: `name` and `oar_name` hold identical bytes on all
      # 189 rows, so a consumer that should have moved and did not looks exactly like one
      # that was checked. #187 read all 38 sites on `main` and recorded a classification
      # beside each of the 33 that still read `name` once its two joins had moved; this
      # keeps that true, by refusing a registry-name read that nobody has classified.
      # Source scan only — no registry read, no network.
      - name: Every registry-name read must be classified
        run: python3 src/name_readers.py --check
      - name: Registry-name classification gate must fire (selftest)
        run: python3 src/name_readers.py --selftest
      # The two OAR-derived joins that moved onto `oar_name` in #187, proven against a
      # registry whose two names DIFFER — which no committed row's do, so a proof read from
      # committed data would pass whichever field the code reads. Synthetic fixtures: no
      # network, no corpus scan (enrich_oar.py --check, the full-corpus half, runs nightly
      # below).
      - name: OAR enrichment stamps the OAR name (selftest)
        run: python3 src/enrich_oar.py --selftest
      - name: OAR discovery is keyed on the OAR name (selftest)
        run: python3 src/catalog_oar.py --selftest
      # `enabling_authority` is written by ONE thing — the hand-reviewed MAPPED/UNMAPPED
      # tables in link_enabling_authority.py — and this verifies the registry against them
      # in both directions, plus every citation against the mirrored ORS and executive
      # orders. It can fail while both tables are empty: a row that acquired an authority
      # any other way is reported, which is the drift a single writer exists to prevent.
      # ~10 s; reads committed data only, no network.
      - name: Enabling authorities must match the reviewed table
        run: python3 src/link_enabling_authority.py --check
      # A relation's kind, basis and authority are written by ONE thing, and this verifies
      # the registry against that derivation in both directions — so a kind that arrived any
      # other way is reported, and so is a body whose candidate has been reviewed since the
      # last --apply, which is the row still recording a proposal after a human read it.
      # Reads committed data only (the registry and the review sheet), no network.
      - name: Relation kinds must match the derivation
        run: python3 src/derive_relation_kinds.py --check
      # The committed schema's `recheck` node against the declaration it is generated from,
      # plus every source group's declared cadence against it. Reads committed data only
      # (the schema and _meta/sources/*.yml), no network.
      - name: Recheck cadences must be declared once
        run: python3 src/check_updates.py --check
      # Conflict candidates that need no model. A hand-labelled taxonomy of the 137
      # frontier-pilot candidates found 29% were of four deterministic types, and code
      # finds far more of them than the models did — the pilot reported 21 dead citations
      # in total, this scan finds 5,734. It was written, worked, and was wired into
      # nothing; the artifact could drift from the corpus indefinitely with no signal.
      # 55 seconds over all 36,953 rules, no network, no model.
      - name: Mechanical conflict findings must be current
        run: python3 src/detect_mechanical.py --check

      # --- heaviest full-corpus scans: nightly / on-demand only ---
      # agency_profile selftest: scans every one of ~69k files' frontmatter with no
      # cross-process cache (its in-memory stats cache only helps a long-lived process
      # like the MCP server, not a fresh CI checkout), so it takes several minutes —
      # too slow for the per-PR fast tier, same tradeoff as review_queue/enrich_oar/
      # enrich_statutes below.
      - name: Agency profile engine selftest (nightly)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 src/agency_profile.py --selftest
      - name: MCP query engine smoke test (nightly)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          pip install "corpus-toolkit @ git+https://github.com/OregonAI/corpus-toolkit@v1.28.0"
          python3 -c "
          import sys
          from corpus_toolkit import config as config_mod
          from corpus_toolkit.mcp.framework import CorpusFramework
          config = config_mod.load('_meta/corpus.yml')
          fw = CorpusFramework(config)
          fails = []
          def check(name, cond):
              print(('PASS ' if cond else 'FAIL ') + name)
              if not cond: fails.append(name)
          r = fw.resolve_citation('OAR 125-800-0020')
          check('renumbered OAR citation resolves', any(m['id']=='oar-128-030-0020' for m in r['matches']))
          r = fw.resolve_citation('ORS 276A.300')
          check('ORS citation resolves', any(m['id']=='ors-276a.300' for m in r['matches']))
          r = fw.resolve_citation('Or. Const. Art. VI, sec. 1')
          check('constitutional citation resolves', any(m['id']=='orconst-art-vi-sec-1' for m in r['matches']))
          r = fw.resolve_citation('Or. Const. Art. VI, sec. 99')
          check('a section the page does not print resolves to nothing', r.get('unresolved') and not r['matches'])
          check('...and says the page prints no such section', 'no section 99' in (r.get('note') or ''))
          r = fw.get_document('oar-128-030-0020')
          check('get_document returns body + disclaimer', 'body' in r and r.get('disclaimer'))
          r = fw.corpus_overview()
          check('corpus_overview counts documents', sum(r['documents_by_type'].values()) > 60000)
          r = fw.issuing_body_profile('department-of-administrative-services')
          check('issuing_body_profile has real doc counts', isinstance(r.get('in_repo'), dict) and sum(r['in_repo'].values()) > 100)
          sys.exit(1 if fails else 0)
          "
      - name: Policy-age dataset must match the corpus (nightly; full-corpus scan)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 src/build_policy_age_data.py --check
      - name: Review queue must be current (nightly)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 src/review_queue.py --check
      - name: ORS frontmatter must match each statute's own history notes (nightly)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 src/enrich_statutes.py --check
      - name: OAR frontmatter must match each rule's own structured lines (nightly)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 src/enrich_oar.py --check
