name: validate-frontmatter

# PRs and pushes validate only the CHANGED files (corpus-toolkit's reusable workflow
# branches on github.event_name itself); the full-corpus frontmatter validation and the
# nightly-tier gates run on schedule + manual dispatch — at ~82k files they blow past a
# reasonable per-PR budget.
#
# THE GATES ARE A TEST SUITE NOW (card 2 of the 2026-09-02 architecture review). Until
# 2026-09-04 this file was 1,009 lines: 79 gates as individual steps, hand-bin-packed into
# five shard jobs by a cost manifest that a 547-line script checked against the YAML, a
# fan-in job asserting every shard's result, and a 465-line local runner re-deriving the
# list from the YAML. Adding one rule meant six artefacts in four files. On 2026-08-29 one
# gate grew a full-corpus walk inside a 2-minute step budget and main was red for five days
# with seven PRs merged over it; a cancelled step read as somebody's choice.
#
# Now `tests/gates.py` is the list (name, argv, tier, serial, timeout — one entry per
# gate, the argv exactly as the steps ran it), `tests/test_gates.py` runs them, and pytest
# is the runner CI and a developer share: `pytest -n auto` locally is this job. A red X
# names a test; a timeout fails that test and no other; `--durations` prints the real cost
# every run instead of a declared column that drifted two orders of magnitude (#359).
#
# TWO PHASES, SPREAD OVER RUNNERS, and the required check keeps the name `generated-views`
# (a fan-in) so branch protection — which requires that literal check name — needs no edit
# and no transition window.
# Phase 1 runs the `--check` gates in parallel: they read the tree. Phase 2 runs the
# `--selftest` gates one at a time: each breaks a fixture in the working tree, watches a
# rule fire, and restores it, so none may run beside ANY other gate — the constraint
# `src/check_all.py -j` used to implement by hand, and the reason the old shards were safe
# only because each was its own checkout. A dirty-tree guard between serial gates fails the
# gate that leaked, by name, and resets the tree for the next (`tests/conftest.py`).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 8 * * *"   # nightly full-corpus audit
  workflow_dispatch:

jobs:
  frontmatter:
    uses: OregonAI/corpus-toolkit/.github/workflows/validate-frontmatter.yml@v1

  # THE GATES, SPREAD OVER RUNNERS. The first CI run of this suite (PR #370) measured the
  # one thing a local run could not: four full-corpus walks on one 4-core runner ran 4-5x
  # slower than on a developer machine (410 s for a gate that takes 92 s locally; phase 1
  # 15 min against 3:46) and one gate hit a budget that had been written for a runner to
  # itself. Every timeout in tests/gates.py assumes that exclusive use, as the old shards
  # gave it. So each runner runs ONE gate at a time, and the gates are spread over runners
  # instead: GATE_SLICE=n/k keeps every k-th gate by sorted name within the phase, computed
  # at collection time from the registry, so there is still no manifest, no hand-packing,
  # and adding a gate is still one entry. Phase 1 (42 read-only checks, 626 s serial) over
  # four runners; phase 2 (36 tree-mutating selftests, 205 s serial, 9 min on a runner)
  # over two. Expected wall clock ~5 min against 11.6 before.
  gates-check:
    strategy:
      fail-fast: false
      matrix:
        slice: ["1/4", "2/4", "3/4", "4/4"]
    runs-on: ubuntu-latest
    timeout-minutes: 30   # a backstop for a hang only; every gate is killed by its own budget, by name
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # some gates read git history
      - uses: ./.github/actions/generated-views-setup
      - run: pip install pytest pytest-timeout
      - name: Phase 1 — parallel-safe gates, slice ${{ matrix.slice }}
        env:
          GATE_SLICE: ${{ matrix.slice }}
        run: python3 -m pytest -m "check and not nightly"

  gates-selftest:
    strategy:
      fail-fast: false
      matrix:
        slice: ["1/2", "2/2"]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/generated-views-setup
      - run: pip install pytest pytest-timeout
      - name: Phase 2 — tree-mutating gates, one at a time, slice ${{ matrix.slice }}
        env:
          GATE_SLICE: ${{ matrix.slice }}
        run: python3 -m pytest -m "selftest and not nightly"

  # THE REQUIRED CHECK, and only a fan-in: branch protection requires the literal name
  # `generated-views`, so the name stays and the work moved into the two matrices above.
  # `if: always()` so a failed, cancelled OR skipped slice fails this job -- a skipped
  # required check does not report a failure, which is the "cancelled reads as somebody's
  # choice" trap this repo has paid for twice.
  generated-views:
    needs: [gates-check, gates-selftest]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every slice of both phases must have succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON"
          fail=0
          for job in $(echo "$NEEDS_JSON" | jq -r 'keys[]'); do
            result=$(echo "$NEEDS_JSON" | jq -r --arg j "$job" '.[$j].result')
            echo "$job: $result"
            [ "$result" = "success" ] || { echo "FAIL  $job reported '$result', not success"; fail=1; }
          done
          exit $fail

  # NIGHTLY TIER: gates too slow for a PR (full-corpus scans, the MCP smoke test). Not what
  # a PR waits on; branch protection does not require this job. Same two phases.
  generated-views-nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/generated-views-setup
      - run: pip install pytest pytest-timeout
      - name: Phase 1 — nightly parallel-safe gates
        run: python3 -m pytest -m "check and nightly"
      - name: Phase 2 — nightly tree-mutating gates, one at a time
        if: always()
        run: python3 -m pytest -p no:xdist -m "selftest and nightly"
