name: detect-upstream-changes

# Cron retired 2026-07-18; scheduled checking REINSTATED 2026-08-02 in
# scheduled.yml (monthly per-cadence groups + quarterly full sweep, toolkit
# v1.22.0's --group + partial-failure tolerance). This workflow remains as a
# manual full sweep; /check-updates (.claude/skills/check-updates) stays the
# precise on-demand tool per update group (_meta/sources/*.yml).
on:
  workflow_dispatch:

jobs:
  detect:
    permissions:
      contents: write
      issues: write
    uses: OregonAI/corpus-toolkit/.github/workflows/detect-upstream-changes.yml@v1.19.0
    with:
      # Pin the CODE, not just the workflow file. Omitting this used to
      # silently install v1.0.5 regardless of the tag above.
      toolkit-ref: v1.19.0
