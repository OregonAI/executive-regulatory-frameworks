name: detect-upstream-changes

# Cron retired 2026-07-18: routine update checking is done on demand via the
# /check-updates skill (.claude/skills/check-updates), scoped per update group
# (_meta/sources/*.yml). This workflow remains as a manual full sweep.
on:
  workflow_dispatch:

jobs:
  detect:
    permissions:
      contents: write
      issues: write
    uses: OregonAI/corpus-toolkit/.github/workflows/detect-upstream-changes.yml@v1.4.0
    with:
      # Pin the CODE, not just the workflow file. Omitting this used to
      # silently install v1.0.5 regardless of the tag above.
      toolkit-ref: v1.4.0
