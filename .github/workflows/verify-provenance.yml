name: verify-provenance

# PRs and pushes verify only the CHANGED files (corpus-toolkit's reusable workflow
# branches on github.event_name itself); the nightly cron (and manual
# workflow_dispatch) run the full-corpus verification — at ~69k files a full pass is
# far too slow for a per-PR gate.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 8 * * *"   # nightly full-corpus verification
  workflow_dispatch:

jobs:
  verify:
    uses: OregonAI/corpus-toolkit/.github/workflows/verify-provenance.yml@v1.0.5
    with:
      jobs: "2"
