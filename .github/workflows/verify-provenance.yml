name: verify-provenance

# PRs and pushes verify only the CHANGED files (corpus-toolkit's reusable workflow
# branches on github.event_name itself); the nightly cron (and manual
# workflow_dispatch) run the full-corpus verification — at ~69k files a full pass is
# far too slow for a per-PR gate.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 8 * * *"   # nightly full-corpus verification
  workflow_dispatch:

jobs:
  verify:
    uses: OregonAI/corpus-toolkit/.github/workflows/verify-provenance.yml@v1.5.3
    with:
      # Pin the CODE, not just the workflow file. Omitting this used to
      # silently install v1.0.5 regardless of the tag above.
      toolkit-ref: v1.5.3
    # jobs: left unset — the CLI auto-detects the runner's own cpu_count rather than
    # a hardcoded worker number, so this scales automatically with whatever runner
    # (GitHub-hosted or self-hosted) actually executes it.
