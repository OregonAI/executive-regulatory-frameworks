name: check-links

# Link-checking ~69k markdown files hits every external URL — far too slow (and too
# noisy to external hosts) for a per-PR gate, and link rot shouldn't block a merge.
# Runs weekly and on manual dispatch only.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1" # weekly, Monday 09:17 UTC

jobs:
  links:
    uses: OregonAI/corpus-toolkit/.github/workflows/check-links.yml@v1
    with:
      # SCOPE: THE LINKS THIS CORPUS PUBLISHES, NOT THE LAW IT MIRRORS (#435). ~81,900 of the
      # ~82,100 markdown files are `content_mode: verbatim` copies of an OAR/ORS/EO/policy,
      # and a faithful copy of a page that cites a URL that died years ago is accurate, not
      # link rot -- "fixing" it would mean editing the law. Scanning them took 45-60 minutes
      # and never passed, then hit the six-hour limit (2026-09-21, -28, 10-05). Our own links
      # are checked instead by `src/check_source_urls.py` (job below) for every document's
      # `source_url`, and by lychee for everything curated: README/docs, every `_index.md`
      # and CHANGELOG, external-references/, llms.txt.
      #
      # Each line is a lychee --exclude-path REGEX (a search over the path, no look-ahead),
      # kept to [A-Za-z0-9_./-] because the reusable workflow splices them into a shell
      # command unquoted. They name FILE PREFIXES, not directories, so `_index.md` and
      # CHANGELOG.md in the same directories stay in scope. `python3 src/check_links_scope.py
      # --check` derives which documents are verbatim from their own `content_mode` and
      # fails if one is left out of this list or a curated one is swept into it -- a new
      # agency's policy prefix lands there as a red gate, not as a slow weekly run.
      #
      # LOSSES, DECLARED: `executive-orders/eo-` and `/oam-` also match 2 summary EOs and 3 summary OAM
      # exhibits (and `/dhs-` a hidden decision record), which a prefix cannot tell from their verbatim siblings. Their body links
      # are unscanned (their `source_url`s are checked); the list is KNOWN_UNCOVERED in
      # src/check_links_scope.py. DAS `das-105-*` (all summary) is deliberately not listed.
      exclude-paths: |
        _meta/snapshots
        _meta/templates
        /oar-
        /ors-
        /orconst-
        executive-orders/eo-
        /oam-
        /das-10-
        /das-107-
        /das-20-
        /das-30-
        /das-40-
        /das-50-
        /das-60-
        /das-70-
        /doc-
        /deq-
        /dhs-
        /eis-css-itcs
        /eis-css-secplan
        /eis-css-program-plan
        /oha-
        /omd-
        /oweb-
        /oya-
        /puc-
        /schedule-
      # BY URL, AND ONLY FOR LINKS NOTHING HERE CAN FIX. Each was checked by hand before
      # being listed; a host that merely failed once is NOT here, because excluding a
      # working link is how a link check stops being one.
      exclude-urls: |
        ^http://deq05/
      # ADR 0007. The dhsoha exclusion is GONE, not muted differently: `_meta/tls-chain/`
      # supplies the intermediate that host omits, so its links can be checked strictly
      # rather than skipped. Whether lychee reads SSL_CERT_FILE depends on its TLS backend
      # and is not assumed here — if this run goes red on those 43 links, the exclusion
      # comes back with lychee's backend named as the cause, so the mute is attributed to
      # our checker instead of to Oregon's server.
      chain-supplements: true
      # TRANSIENT REFUSALS (#437). The first live run turned red on 3 OARD links in DRIFT.md,
      # "Connection failed", that answer 200 when asked again. Retry before calling a link
      # broken: 5 attempts (the toolkit default is 3 / 2 s) waiting 10 s between them, which
      # lets a host that refuses a burst recover. accept-codes is NOT widened: a 404 or 403
      # is still an error, and a link that refuses all 5 attempts is still red.
      max-retries: 5
      retry-wait-time: 10

  # OUR OWN LINKS, which the lychee scope above no longer reads inside verbatim documents:
  # every document's frontmatter `source_url` that is not a drift-manifest URL (36,586 of
  # 44,638 distinct, 2026-10-06 -- 36,008 of them per-rule OAR pages). Bounded: small hosts
  # in full every run, the OAR pages in a rotating window (full cycle 30 weeks), a 40-minute
  # fetch deadline that reports what it did not reach and exits 2 (red) then. See src/check_source_urls.py.
  source-urls:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Fetch the source_urls nothing else checks
        run: python3 src/check_source_urls.py
