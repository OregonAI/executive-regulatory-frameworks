name: check-links

# Link-checking ~69k markdown files hits every external URL — far too slow (and too
# noisy to external hosts) for a per-PR gate, and link rot shouldn't block a merge.
# Runs weekly and on manual dispatch only.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1" # weekly, Monday 09:17 UTC

jobs:
  links:
    uses: OregonAI/corpus-toolkit/.github/workflows/check-links.yml@v1.30.0
    with:
      # Pin the CODE, not just the workflow file. Omitting this used to
      # silently install v1.0.5 regardless of the tag above.
      toolkit-ref: v1.30.0
      exclude-paths: |
        _meta/snapshots
        _meta/templates
      # BY URL, AND ONLY FOR LINKS NOTHING HERE CAN FIX. Each was checked by hand before
      # being listed; a host that merely failed once is NOT here, because excluding a
      # working link is how a link check stops being one.
      exclude-urls: |
        ^http://deq05/
        ^https://sharedsystems\.dhsoha\.state\.or\.us/
