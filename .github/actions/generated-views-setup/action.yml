name: generated-views setup
description: >
  Shared toolchain preamble for every generated-views-shard-N and
  generated-views-nightly job (#268 code review). Single-sourced so a future
  re-shard cannot produce a shard that is subtly less capable than its
  siblings -- which is exactly how shards 1-4 lost the corpus-toolkit install
  that shard-5 kept, in the change this action was added to fix.

  THREE PINS MOVE TOGETHER here (the corpus-toolkit checkout ref below and
  requirements.txt's own `corpus-toolkit @ git+...@v1.31.1` pin) -- same trap
  oregon-audits documents in its generated job (corpus-toolkit#9).

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0   # some of these scripts read git history
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - run: pip install pyyaml
      shell: bash
    - uses: actions/checkout@v4
      with:
        repository: OregonAI/corpus-toolkit
        ref: v1.31.1
        path: .toolkit
    - run: pip install ./.toolkit
      shell: bash
