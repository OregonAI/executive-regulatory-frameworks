name: generated-views setup
description: >
  Shared toolchain preamble for the generated-views and generated-views-nightly
  jobs. Single-sourced (#268 code review) so the two jobs cannot drift apart in
  what they install -- which is exactly how, under the old five-shard layout,
  shards 1-4 lost the corpus-toolkit install that shard-5 kept.

  ONE PIN, and it is not in this file: the toolkit is installed at the exact tag
  requirements.txt names (corpus-toolkit ADR-0014), so the gates prove the toolkit this
  corpus actually ships and a release moves one line in one file. This action used to
  carry its own checkout ref, which sat at v1.31.1 while requirements.txt said v1.32.0 --
  the drift corpus-toolkit#9 was about, one shape over.

  THE REPO CHECKOUT IS NOT HERE, and cannot be: GitHub must read this file off disk to load
  the action at all, so a local action cannot be what checks out the repo containing it. Every
  caller does `actions/checkout` (with `fetch-depth: 0` -- some of these scripts read git
  history) as its own first step, then calls this. Measured the hard way on the #268 PR: with
  the checkout inside here, all five shards died in 2-4s with "Can't find 'action.yml' ...
  Did you forget to run actions/checkout before running your local action?"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - run: pip install pyyaml
      shell: bash
    # Install the toolkit at the SERVING pin -- the exact tag requirements.txt names and the
    # Dockerfile bakes -- so these gates prove the toolkit this corpus actually ships. ONLY that
    # line: this repo's requirements.txt also pulls torch and sentence-transformers for
    # serve-time semantic search, which no CI gate touches. The reusable workflows run the CI
    # track at `@v1` (corpus-toolkit ADR-0014); requirements.txt is the one pin left to move.
    - run: pip install "$(grep -E '^corpus-toolkit' requirements.txt)"
      shell: bash
