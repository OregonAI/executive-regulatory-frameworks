# Gate name -> measured seconds (local, warm checkout, 2026-08-28) and the shard
# it is bin-packed into for .github/workflows/validate-frontmatter.yml's
# generated-views-shard-N jobs (#268). Regenerate the `shard` column with:
#   python3 src/shard_generated_views.py --plan N
# then hand-place any moved gate into its new shard job and update `shard:` here
# to match -- `src/shard_generated_views.py --check` fails the run if this file
# and the workflow disagree about which gate runs where, or if a gate the
# workflow runs is missing here entirely.
#
# The llms.txt gate below (--check and --selftest, both proofs) is one CI step / one
# process, not two -- a code-review follow-up to #268 folded the second gate's echo-only
# step into this one so it stays a gate that can actually fail. build_llms.py's build()
# walks the whole corpus, so sharing the call this way is what makes that walk get paid
# once per run rather than twice.
#
# Nightly-only gates (generated-views-nightly; schedule/workflow_dispatch) are not
# in this manifest at all -- #268 is explicit that they are "not what a PR waits
# on", so they carry no PR-tier cost to account for.
